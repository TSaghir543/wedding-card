<!-- Custom RSVP -->
<div id="rsvpOverlay" role="dialog" aria-modal="true" aria-labelledby="rsvpTitle">
  <div id="rsvpCard">
    <button id="rsvpClose" type="button" aria-label="Close RSVP">&times;</button>
    <h2 id="rsvpTitle">Will you join us?</h2>
    <p class="rsvpIntro">We would love to celebrate this special day with you.</p>

    <form id="rsvpForm"
          action="https://formsubmit.co/tayyaba.saghir543@gmail.com"
          method="POST">
      <input type="hidden" name="_subject" value="Wedding RSVP">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

      <label class="rsvp-label" for="rsvpName">Your Name</label>
      <input id="rsvpName" name="Name" type="text" placeholder="Enter your name" required>

      <label class="rsvp-label">Will you be attending?</label>
      <div class="rsvp-options">
        <label class="rsvp-option">
          <input type="radio" name="Attendance" value="Yes, I'll be there!" required>
          <span>Yes, I'll be there!</span>
        </label>
        <label class="rsvp-option">
          <input type="radio" name="Attendance" value="Sorry, I can't make it">
          <span>Sorry, I can't make it</span>
        </label>
      </div>

      <button id="rsvpSubmit" type="submit">Send RSVP</button>
      <p id="rsvpMessage"></p>
    </form>
  </div>
</div>

<script>
(function () {
  var overlay = document.getElementById("rsvpOverlay");
  var close = document.getElementById("rsvpClose");
  var form = document.getElementById("rsvpForm");
  var message = document.getElementById("rsvpMessage");
  var submit = document.getElementById("rsvpSubmit");
  var popupTimer = null;
  var closeTimer = null;
  var RSVP_DELAY_MS = 8000;
  var SUCCESS_CLOSE_MS = 2000;

  function openRSVP() {
    overlay.style.display = "flex";
    setTimeout(function () { document.getElementById("rsvpName").focus(); }, 50);
  }

  function closeRSVP() {
    overlay.style.display = "none";
    message.textContent = "";
    submit.disabled = false;
    submit.textContent = "Send RSVP";
    if (closeTimer) {
      clearTimeout(closeTimer);
      closeTimer = null;
    }
  }

  function scheduleRSVPPopup() {
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(function () {
      popupTimer = null;
      openRSVP();
    }, RSVP_DELAY_MS);
  }

  window.openRSVP = openRSVP;

  close.addEventListener("click", closeRSVP);

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeRSVP();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.style.display === "flex") closeRSVP();
  });

  document.addEventListener("click", function (e) {
    var link = e.target.closest("#hl0_a8bb0d9");
    if (!link) return;
    scheduleRSVPPopup();
  }, true);

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    submit.disabled = true;
    submit.textContent = "Sending...";
    message.textContent = "";

    try {
      var response = await fetch(form.action, {
        method: "POST",
        headers: { "Accept": "application/json" },
        body: new FormData(form)
      });

      if (!response.ok) throw new Error("Submission failed");

      message.textContent = "Thank you! Your RSVP has been received.";
      message.style.color = "#6d5570";
      form.reset();
      submit.textContent = "RSVP Sent";
      closeTimer = setTimeout(closeRSVP, SUCCESS_CLOSE_MS);
    } catch (error) {
      message.textContent = "Something went wrong. Please try again.";
      message.style.color = "#a04d4d";
      submit.disabled = false;
      submit.textContent = "Send RSVP";
    }
  });
})();
</script>
